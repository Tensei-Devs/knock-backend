name: ci-pr

# Nivel rápido: corre en cada PR y en cada push a las ramas fijas. El job `gate` es el check requerido
# por la protección de ramas (docs/BRANCH_PROTECTION.md). Los jobs de código se saltan solos mientras
# el proyecto no exista (antes de TT-API-01); el resto aplica desde el primer commit.
# Seguridad del workflow: pull_request (no pull_request_target), permisos mínimos por job, sin secretos
# en jobs que ejecutan código del PR, acciones fijadas a SHA (scripts/ci/pin_actions.py).
# Repos privados sin GitHub Advanced Security: la revisión de dependencias y la subida de SARIF se saltan
# (no se quitan los escáneres); con la variable de repositorio GHAS_ENABLED=true se activan.
# Pasos que dependen de archivos que llegan con otras tareas (herramientas, DatabaseTest, ContractTest,
# export_openapi.py, stryker-config.json, pila de CI del DAST) se omiten mientras no existan y corren solos al agregarlos.

on:
  pull_request:
    branches: [main, release, develop, "sprint-*"]
    # labeled y unlabeled: la comprobación de puntos (spec 012) debe reevaluarse al poner o quitar la etiqueta.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main, release, develop, "sprint-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Solo los pull_request cancelan runs viejos del mismo PR; los push a ramas fijas (sprint-*, main, release, develop) terminan,
  # porque cada merge cancelaba el run completo del push anterior. El group ya distingue PR (refs/pull/N/merge) de push (refs/heads/X).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  MIN_LINES: "60"
  MIN_BRANCHES: "50"

jobs:
  detect:
    name: Detectar proyecto, cambios y spec
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.d.outputs.api }}
      docker: ${{ steps.d.outputs.docker }}
      iac: ${{ steps.d.outputs.iac }}
      dast: ${{ steps.d.outputs.dast }}
      gateway: ${{ steps.d.outputs.gateway }}
      identity: ${{ steps.d.outputs.identity }}
      messaging: ${{ steps.d.outputs.messaging }}
      market: ${{ steps.d.outputs.market }}
      docsonly: ${{ steps.d.outputs.docsonly }}
      spec: ${{ steps.d.outputs.spec }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: d
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          {
            echo "api=$([ -f Knock.slnx ] && echo true || echo false)"
            echo "docker=$(ls src/*/Dockerfile >/dev/null 2>&1 && echo true || echo false)"
            echo "iac=$([ -d deploy/infra ] && echo true || echo false)"
            echo "dast=$([ -f deploy/docker-compose.ci.yml ] && [ -f tests/smoke/smoke.sh ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          KEY=$(echo "$HEAD_REF" | grep -oE 'KNOCK-[0-9]+' || true)
          SPEC=""
          if [ -n "$KEY" ]; then
            # Solo cuenta la cabecera «> **Jira:** KNOCK-N · …»: otra spec puede citar la clave en su texto
            # (p. ej. TT-BD-06 cita KNOCK-29) y, por orden alfabético, ganaría a la spec propia de la tarea.
            SPEC=$(grep -lE "^> \*\*Jira:\*\* [A-Z0-9, -]*\b$KEY\b" specs/*/spec.md 2>/dev/null | head -1 | cut -d/ -f2 | grep -oE '^(HU-[0-9]{3}|TT-[A-Z]+-[0-9]{2}|BUG-[0-9]{3})' || true)
          fi
          # La trazabilidad caso ↔ prueba solo tiene sentido si el PR toca código o pruebas; los PR de configuración,
          # documentación o gobierno de una tarea con spec no deben fallar por «casos sin prueba».
          CHANGED=$(git diff --name-only "$BASE_SHA" HEAD 2>/dev/null || true)
          if [ -z "$BASE_SHA" ]; then
            # Push: `before` cubre todos los commits del push, no solo el último. `before` de ceros =
            # rama nueva: no hay base y se considera que cambió todo.
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              # Disparo manual: no hay `before` ni base; se corre todo (sin esto caía a HEAD~1 y podía omitir el API).
              CHANGED="__ALL__"
            elif [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
              CHANGED=$(git diff --name-only "$EVENT_BEFORE" HEAD 2>/dev/null || echo "__ALL__")
            else
              CHANGED="__ALL__"
            fi
          fi
          # Cambios por servicio (KNOCK-202): solo se construye lo afectado. Un cambio en los
          # contratos compartidos (Knock.Contracts), en las bibliotecas técnicas (Knock.Hosting, Knock.Hosting.Data y Knock.Hosting.Mvc) o en archivos compartidos de compilación
          # (Directory.Build.*, Directory.Packages.props, global.json, NuGet.config, *.sln/*.slnx,
          # *.props/*.targets) afecta a los cuatro servicios.
          SHARED='^src/Knock\.Contracts/|^src/Knock\.Hosting(\.Data|\.Mvc)?/|^Directory\.|\.(slnx?|props|targets)$|^global\.json$|^[Nn]u[Gg]et\.config$'
          hit() { [ "$CHANGED" = "__ALL__" ] || grep -qE "$1" <<<"$CHANGED"; }
          {
            echo "gateway=$(hit "^src/Knock\.Gateway/|$SHARED" && echo true || echo false)"
            echo "identity=$(hit "^src/Knock\.Identity\.Api/|$SHARED" && echo true || echo false)"
            echo "messaging=$(hit "^src/Knock\.Messaging\.Api/|$SHARED" && echo true || echo false)"
            echo "market=$(hit "^src/Knock\.Market\.Api/|$SHARED" && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          # Solo documentos: ningún archivo cambiado fuera de docs/ (salvo docs/openapi*.json, que es contrato),
          # specs/, *.md, db/README.md y Memoria.md. Con lista vacía o «__ALL__» NO es solo documentos (falla cerrado).
          # Solo se salta el job «API — build, formato y pruebas»; contrato, SAST, Gitleaks y gobierno siguen.
          DOCS_ONLY=false
          if [ -n "$CHANGED" ] && [ "$CHANGED" != "__ALL__" ]             && ! grep -vE '^(docs/|specs/)|\.md$|^db/README\.md$|^Memoria\.md$' <<<"$CHANGED" | grep -q .             && ! grep -qE '^docs/openapi[^/]*\.json$' <<<"$CHANGED"; then
            DOCS_ONLY=true
            echo "::notice::PR solo de documentos: se omite el job API."
          fi
          echo "docsonly=$DOCS_ONLY" >> "$GITHUB_OUTPUT"
          if [ -n "$SPEC" ] && [ -n "$BASE_SHA" ] && ! grep -qE '^(src|tests)/' <<<"$CHANGED"; then
            echo "::notice::PR sin cambios de código ni pruebas: se omite la trazabilidad de $SPEC."
            SPEC=""
          fi
          echo "spec=$SPEC" >> "$GITHUB_OUTPUT"

  pr-meta:
    name: Rama, commits y PR (branch-name)
    # Desactivado en la migración a Demo Base: exige ramas KNOCK-n de Jira. Se activa poniendo la variable del repositorio ENFORCE_BRANCH_RULES=true.
    if: github.event_name == 'pull_request' && vars.ENFORCE_BRANCH_RULES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Nombre de rama y combinación origen → destino
        run: python scripts/ci/branch_rules.py branch --head "$HEAD_REF" --base "$BASE_REF"
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
      - name: Mensajes de commit
        run: python scripts/ci/branch_rules.py commits --range "origin/$BASE_REF..HEAD"
        env:
          BASE_REF: ${{ github.base_ref }}
      - name: Título y plantilla del PR (incluye «Uso de IA»)
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > pr_body.md
          python scripts/ci/branch_rules.py pr --head "$HEAD_REF" --title "$PR_TITLE" --body-file pr_body.md

  pr-points:
    name: Etiqueta de puntos del PR (spec 012)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Las etiquetas salen del evento (no hay llamadas a la API ni token); llegan por entorno, nunca dentro del script.
      - name: Etiqueta puntos-<componente>-N
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          HEAD_REF: ${{ github.head_ref }}
        run: python scripts/ci/version.py check-labels

  governance:
    needs: detect
    uses: ./.github/workflows/_governance.yml
    with:
      spec: ${{ needs.detect.outputs.spec }}

  build-test:
    name: API — build, formato y pruebas
    needs: detect
    if: needs.detect.outputs.api == 'true' && needs.detect.outputs.docsonly != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet restore Knock.slnx --locked-mode
      - name: Restaurar herramientas de .NET
        if: hashFiles('.config/dotnet-tools.json') != ''
        run: dotnet tool restore
      - name: Build Release (warnings como errores, analizadores, NuGetAudit)
        run: dotnet build Knock.slnx -c Release --no-restore -warnaserror
      - name: Formato y estilo
        run: dotnet format Knock.slnx --verify-no-changes --no-restore
      - name: Unitarias y arquitectura
        run: dotnet test tests/UnitTest -c Release --no-build --filter "Category!=Performance" --collect:"XPlat Code Coverage" --results-directory reports/unit --logger trx
      # Las pruebas de tiempo (Category=Performance) corren sin cobertura: la instrumentación las vuelve inestables y no mide lo que se quiere.
      - name: Rendimiento (sin cobertura)
        run: dotnet test tests/UnitTest -c Release --no-build --filter "Category=Performance" --results-directory reports/performance --logger trx
      - name: Arquitectura (fronteras entre servicios)
        run: dotnet test tests/ArchitectureTest -c Release --no-build --logger trx --results-directory reports/architecture
      - name: Emulador de Firebase Auth
        run: bash scripts/ci/firebase_emulator.sh
      - name: Seguridad negativa
        run: dotnet test tests/SecurityTest -c Release --no-build --collect:"XPlat Code Coverage" --results-directory reports/security --logger trx
      - name: Contrato (captura del wire)
        if: hashFiles('tests/ContractTest/*.csproj') != ''
        run: dotnet test tests/ContractTest -c Release --no-build --logger trx --results-directory reports/contract
      - name: Contrato OpenAPI regenerado y sin cambios pendientes
        if: hashFiles('scripts/export_openapi.py') != ''
        run: |
          python3 scripts/export_openapi.py --no-build
          python3 scripts/export_openapi.py --no-build --service identity
          python3 scripts/export_openapi.py --no-build --service messaging
          # Spec 034 R-13 y R-15: el contrato público sale de los tres de servicio y de las rutas del gateway (sin compilar).
          python3 scripts/export_openapi.py --publico
          python3 scripts/export_openapi.py --comprobar-publico
          git diff --exit-code --name-only -- docs/openapi.v1.json docs/openapi.identity.v1.json docs/openapi.messaging.v1.json docs/openapi.publico.v1.json || { echo "::error::Los contratos listados arriba cambiaron: regénéralos con scripts/export_openapi.py (--service ... y --publico) y súbelos con el código."; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: api-reports-build
          path: reports/
          if-no-files-found: ignore

  # Integración, base de datos y cobertura van en jobs aparte (KNOCK-266): en un solo job sumaban 51 a 55 de sus 60 minutos.
  # El gate exige los cuatro en verde cuando hay código: aquí un «skipped» no basta.
  test-integration:
    name: API — integración
    needs: detect
    if: needs.detect.outputs.api == 'true' && needs.detect.outputs.docsonly != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet restore Knock.slnx --locked-mode
      - run: dotnet build tests/IntegrationTest -c Release --no-restore -warnaserror
      - name: Emulador de Firebase Auth
        run: bash scripts/ci/firebase_emulator.sh
      - name: Integración (Redis y Azurite con Testcontainers)
        run: dotnet test tests/IntegrationTest -c Release --no-build --collect:"XPlat Code Coverage" --results-directory reports/integration --logger trx
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: api-reports-integration
          path: reports/
          if-no-files-found: ignore

  test-database:
    name: API — base de datos
    needs: detect
    if: needs.detect.outputs.api == 'true' && needs.detect.outputs.docsonly != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet restore Knock.slnx --locked-mode
      - if: hashFiles('tests/DatabaseTest/*.csproj') != ''
        run: dotnet build tests/DatabaseTest -c Release --no-restore -warnaserror
      - name: Base de datos (semillas y restricciones)
        if: hashFiles('tests/DatabaseTest/*.csproj') != ''
        run: dotnet test tests/DatabaseTest -c Release --no-build --logger trx --results-directory reports/database
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: api-reports-database
          path: reports/
          if-no-files-found: ignore

  coverage:
    name: API — cobertura combinada
    needs: [detect, build-test, test-integration]
    if: needs.detect.outputs.api == 'true' && needs.detect.outputs.docsonly != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restaurar herramientas de .NET
        run: dotnet tool restore
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: api-reports-build
          path: reports
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: api-reports-integration
          path: reports
      # Se excluye solo el código que genera el compilador (interceptores de OpenAPI y atributos): no es código de Knock
      # y no se puede probar. Los umbrales de MIN_LINES y MIN_BRANCHES no cambian.
      - name: Cobertura combinada
        run: dotnet tool run reportgenerator -reports:"reports/**/coverage.cobertura.xml" -targetdir:reports/coverage -reporttypes:"Cobertura;MarkdownSummaryGithub;Html" "-classfilters:-Microsoft.AspNetCore.OpenApi.Generated*;-System.Runtime.CompilerServices*"
      - name: Umbral de cobertura (líneas y ramas)
        run: python3 scripts/check_coverage.py --cobertura reports/coverage/Cobertura.xml --min "$MIN_LINES" --min-branch "$MIN_BRANCHES"
      - name: Resumen en el PR
        if: always()
        run: cat reports/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      # Conserva el nombre y la estructura que lee sonarcloud.yml (reports/coverage/Cobertura.xml).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: api-reports
          path: reports/
          if-no-files-found: ignore

  mutation-pr:
    name: Mutación incremental (Stryker, informativa)
    needs: [detect, build-test]
    if: needs.detect.outputs.api == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restaurar herramientas de .NET
        if: hashFiles('stryker-config.json') != ''
        run: dotnet tool restore
      - name: Stryker sobre lo cambiado respecto a la rama destino
        if: hashFiles('stryker-config.json') != ''
        env:
          BASE_REF: ${{ github.base_ref }}
        run: dotnet tool run dotnet-stryker -- --config-file stryker-config.json --since:"origin/$BASE_REF" --break-at 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: mutation-pr
          path: StrykerOutput/
          if-no-files-found: ignore

  sast:
    name: SAST (Semgrep con reglas de Knock)
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --quiet semgrep
      - name: Semgrep (bloquea hallazgos ERROR)
        run: semgrep scan --config .semgrep/semgrep.yaml --config p/csharp --config p/secrets --config p/owasp-top-ten --config p/dockerfile --error --severity ERROR --sarif-output=semgrep.sarif
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: always() && hashFiles('semgrep.sarif') != '' && (github.event.repository.private == false || vars.GHAS_ENABLED == 'true')
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  sca:
    name: SCA (dependencias vulnerables, obsoletas y licencias)
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Revisión de dependencias del PR (vulnerabilidades y licencias)
        if: github.event_name == 'pull_request' && (github.event.repository.private == false || vars.GHAS_ENABLED == 'true')
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, GPL-3.0, GPL-2.0, SSPL-1.0
      - name: OSV-Scanner (NuGet y GitHub Actions)
        run: docker run --rm -v "$PWD":/src ghcr.io/google/osv-scanner:latest scan source -r /src
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: needs.detect.outputs.api == 'true'
        with:
          global-json-file: global.json
      - name: NuGet vulnerables (incluye transitivas) y obsoletos
        if: needs.detect.outputs.api == 'true'
        run: |
          dotnet restore Knock.slnx
          dotnet list Knock.slnx package --vulnerable --include-transitive | tee vuln.txt
          dotnet list Knock.slnx package --deprecated | tee deprecated.txt
          if grep -qE "(High|Critical)" vuln.txt; then echo "::error::Dependencias con vulnerabilidades altas o críticas"; exit 1; fi

  secrets:
    name: Secretos (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks (CLI fijada por versión y suma de verificación; la acción exige licencia en organizaciones)
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1

  openapi-diff:
    name: Cambios incompatibles en el contrato (oasdiff)
    needs: detect
    if: github.event_name == 'pull_request' && needs.detect.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Spec 034 R-15 / CA-12: oasdiff compara cada contrato de servicio con el de la rama destino. Un cambio incompatible falla,
      # salvo con la etiqueta `contrato-incompatible`: entonces pasa y la lista de cambios queda en el resumen del PR.
      - name: Contratos base vs PR (oasdiff)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          permitido=false
          if echo "$PR_LABELS" | grep -q '"contrato-incompatible"'; then permitido=true; fi
          malos=0
          for f in openapi.v1.json openapi.identity.v1.json openapi.messaging.v1.json openapi.publico.v1.json; do
            [ -f "docs/$f" ] || continue
            git show "$BASE_SHA:docs/$f" > "base.$f" 2>/dev/null || { echo "docs/$f es nuevo: nada que comparar"; continue; }
            if ! docker run --rm -v "$PWD":/w -w /w tufin/oasdiff breaking "base.$f" "docs/$f" --fail-on ERR > "diff.$f.txt"; then
              malos=1
              { echo "### Cambios incompatibles en docs/$f"; echo '```'; cat "diff.$f.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
              cat "diff.$f.txt"
            fi
          done
          if [ "$malos" = 1 ] && [ "$permitido" != true ]; then
            echo "::error::Cambio incompatible en el contrato. Si es intencional, el PR necesita la etiqueta contrato-incompatible."; exit 1
          fi
          if [ "$malos" = 1 ]; then echo "::warning::Cambios incompatibles aceptados por la etiqueta contrato-incompatible (ver el resumen)."; fi

  iac:
    name: IaC, Dockerfile y workflows (Checkov)
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --quiet checkov
      - name: Checkov (Terraform, Bicep, Dockerfile, GitHub Actions)
        run: checkov -d . --framework terraform bicep dockerfile github_actions --quiet --compact --skip-path node_modules --skip-path .terraform

  container:
    name: Contenedor (build, Trivy, Dockle)
    needs: [detect, build-test, test-integration, test-database, coverage]
    if: needs.detect.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Un Dockerfile por servicio (spec 001, R-06: cada servicio se construye y se despliega por separado).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { proyecto: Knock.Gateway, imagen: knock-gateway, salida: gateway }
          - { proyecto: Knock.Identity.Api, imagen: knock-identidad, salida: identity }
          - { proyecto: Knock.Messaging.Api, imagen: knock-mensajeria, salida: messaging }
          - { proyecto: Knock.Market.Api, imagen: knock-mercado, salida: market }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # KNOCK-202: no se construye un servicio que no cambió (detect.outputs.<svc> == 'true').
      - name: Servicio sin cambios (se omite su build)
        if: needs.detect.outputs[matrix.salida] != 'true'
        run: 'echo "::notice::${{ matrix.imagen }} sin cambios: se omite su build."'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        if: needs.detect.outputs[matrix.salida] == 'true'
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        if: needs.detect.outputs[matrix.salida] == 'true'
        with:
          context: .
          file: src/${{ matrix.proyecto }}/Dockerfile
          load: true
          tags: ${{ matrix.imagen }}:ci
      # Trivy como contenedor oficial: el instalador de la acción (aquasecurity/setup-trivy) falla con
      # «exit code 6» en los runners sin caché del binario (KNOCK-232). Mismos umbrales que antes.
      - name: Trivy (críticas y altas con corrección bloquean)
        if: needs.detect.outputs[matrix.salida] == 'true'
        env:
          IMAGEN: ${{ matrix.imagen }}:ci
        run: |
          docker run --rm             -v /var/run/docker.sock:/var/run/docker.sock             -v "$PWD:/work" -w /work             ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c             image --severity CRITICAL,HIGH --exit-code 1 --ignore-unfixed             --ignorefile .trivyignore --quiet "$IMAGEN"
      - name: Dockle (buenas prácticas de imagen)
        if: needs.detect.outputs[matrix.salida] == 'true'
        uses: goodwithtech/dockle-action@e30e6af832aad6ea7dca2a248d31a85eab6dbd68 # v0.4.15
        with:
          image: ${{ matrix.imagen }}:ci
          exit-code: "1"
          exit-level: warn
          # EXC-003 (security/exceptions.yaml): falsos positivos de CIS-DI-0010 en variables de la imagen base.
          # Solo estas claves; cualquier otra variable o archivo sospechoso sigue fallando.
          accept-key: DOTNET_VERSION,ASPNET_VERSION,ASPNETCORE_URLS,ASPNETCORE_ENVIRONMENT,ASPNETCORE_HTTP_PORTS,DOTNET_RUNNING_IN_CONTAINER,DOTNET_EnableDiagnostics,APP_UID,org.opencontainers.image.version,org.opencontainers.image.title,org.opencontainers.image.description,org.opencontainers.image.created,--gid,--uid,--clear,PATH
      # SBOM CycloneDX de la imagen construida en este job (KNOCK-266). No es la imagen que publica ci-deploy: esa se vuelve a construir.
      - name: SBOM de la imagen (CycloneDX)
        if: needs.detect.outputs[matrix.salida] == 'true'
        env:
          NOMBRE: ${{ matrix.imagen }}
        run: |
          mkdir -p sbom
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sbom:/sbom" ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c image --format cyclonedx --output "/sbom/${NOMBRE}.cdx.json" --quiet "${NOMBRE}:ci"
          jq -e '.bomFormat == "CycloneDX" and ((.components // []) | length > 0)' "sbom/${NOMBRE}.cdx.json" > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: needs.detect.outputs[matrix.salida] == 'true'
        with:
          name: sbom-${{ matrix.imagen }}
          path: sbom/${{ matrix.imagen }}.cdx.json
          if-no-files-found: error

  dast:
    name: Smoke + DAST (ZAP baseline)
    needs: [detect, container]
    if: needs.detect.outputs.docker == 'true' && needs.detect.outputs.dast == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Credenciales efímeras de la pila (no se imprimen)
        run: |
          for v in CI_DB_PASSWORD:hex:24 CI_REDIS_PASSWORD:hex:24 CI_JWT_KEY:b64:32 CI_KEY_A:b64:32 CI_KEY_B:b64:32 CI_KEY_C:b64:32 CI_KEY_D:b64:32 CI_KEY_E:b64:32 CI_KEY_F:b64:32 CI_KEY_G:b64:32 CI_BLOB_KEY:b64:32; do
            IFS=: read -r nombre tipo largo <<<"$v"
            if [ "$tipo" = hex ]; then valor=$(openssl rand -hex "$largo"); else valor=$(openssl rand -base64 "$largo"); fi
            echo "::add-mask::$valor"; echo "$nombre=$valor" >> "$GITHUB_ENV"
          done
      - name: Datos ficticios (índices y catálogo de ejemplo con db/entrega.js)
        run: |
          docker compose -f deploy/docker-compose.ci.yml up -d --wait --wait-timeout 300 documentdb redis
          docker compose -f deploy/docker-compose.ci.yml run -T seed
      - name: Levantar gateway, Identidad, Mercado, Mensajería, MongoDB (documentdb-local), Redis y Azurite
        run: |
          docker compose -f deploy/docker-compose.ci.yml up -d --build --wait --wait-timeout 600             || { docker compose -f deploy/docker-compose.ci.yml ps; docker compose -f deploy/docker-compose.ci.yml logs --no-color --tail 80 gateway identity market messaging; exit 1; }
      - name: Autoprueba del humo (TC-BUG-001-04)
        run: bash tests/smoke/smoke_test.sh
      - name: Smoke (health, 401 sin token, headers de seguridad)
        run: bash tests/smoke/smoke.sh http://localhost:8080
      - name: ZAP baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:8080
          rules_file_name: security/zap-rules.tsv
          allow_issue_writing: false
          fail_action: true
      # KNOCK-266: segundo escaneo, también pasivo y con las mismas reglas, sobre una lista de rutas con y sin sesión.
      - name: Sesiones ficticias para ZAP (llave efímera del job)
        run: python3 tests/smoke/dast_sesion.py dast-sesion.json
      - name: ZAP baseline con rutas y sesión ficticia
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:8080
          rules_file_name: security/zap-rules.tsv
          cmd_options: --hook /zap/wrk/tests/smoke/zap_rutas.py -P 8099
          artifact_name: zap_scan_sesion
          allow_issue_writing: false
          fail_action: true
      # Si ZAP no encuentra el hook solo avisa y termina en verde: sin el resumen de rutas, el paso falla.
      - name: Comprobar que ZAP recorrió las rutas
        run: |
          test -s dast-rutas.txt || { echo "::error::ZAP no recorrió las rutas de tests/smoke/zap_rutas.py"; exit 1; }
          cat dast-rutas.txt
      - name: Apagar
        if: always()
        run: docker compose -f deploy/docker-compose.ci.yml down -v

  # SBOM CycloneDX de la solución .NET (KNOCK-266): la misma imagen de Trivy del escaneo de contenedores lee los
  # packages.lock.json versionados (incluye las transitivas y las de los proyectos de prueba), sin restaurar ni compilar.
  sbom:
    name: SBOM de la solución .NET (CycloneDX)
    needs: detect
    if: needs.detect.outputs.api == 'true' && needs.detect.outputs.docsonly != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Generar el SBOM
        run: |
          mkdir -p sbom
          docker run --rm -v "$PWD:/work" -w /work ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c fs --format cyclonedx --output sbom/knock-backend-dotnet.cdx.json --quiet .
      - name: El SBOM debe ser CycloneDX y traer paquetes NuGet
        run: |
          jq -e '.bomFormat == "CycloneDX" and ([.components[]? | select((.purl // "") | startswith("pkg:nuget/"))] | length > 0)' sbom/knock-backend-dotnet.cdx.json > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom-dotnet
          path: sbom/knock-backend-dotnet.cdx.json
          if-no-files-found: error

  gate:
    name: gate
    if: always()
    needs: [detect, pr-meta, pr-points, governance, build-test, test-integration, test-database, coverage, sast, sca, secrets, openapi-diff, iac, container, dast, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificaciones bloqueantes en verde (o saltadas por no aplicar)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'EOF'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          for k, v in needs.items():
              print(f"{k}: {v['result']}")
          bad = {k: v["result"] for k, v in needs.items() if v["result"] not in ("success", "skipped")}
          outputs = needs["detect"]["outputs"]
          if outputs.get("api") == "true" and outputs.get("docsonly") != "true":
              # Con código, las pruebas y la cobertura no pueden quedar omitidas (KNOCK-266).
              for job in ("build-test", "test-integration", "test-database", "coverage"):
                  if needs[job]["result"] != "success":
                      bad[job] = needs[job]["result"]
          if needs["detect"]["outputs"].get("docker") == "true" and needs["detect"]["outputs"].get("dast") != "true":
              sys.exit("BUG-001: falta deploy/docker-compose.ci.yml o tests/smoke/smoke.sh; el humo y el DAST no pueden saltarse")
          sys.exit(f"Fallaron: {bad}" if bad else 0)
          EOF
