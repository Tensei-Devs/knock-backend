name: sonarcloud

# Análisis de SonarCloud (informativo). Es un workflow APARTE y queda FUERA del gate: ni `ci-pr` ni la protección de ramas
# dependen de él, y si falla no bloquea ningún PR.
# Reutiliza la cobertura que ya genera `ci-pr`: descarga el artefacto `api-reports` de esa corrida y convierte su
# `reports/coverage/Cobertura.xml` al formato genérico de Sonar. Solo compila (sin pruebas) para que el analizador de C#
# tenga el árbol de compilación.
# Alcance: solo la rama principal `main` (el plan gratuito de SonarCloud analiza esa rama y los PR; aquí no se analizan PR).
# Un `workflow_run` solo se ejecuta si este archivo ya está en la rama predeterminada (`main`): no habrá análisis hasta que llegue
# a `main` con la promoción (paso 3). Antes de eso, `workflow_dispatch` tampoco aparece en la interfaz hasta estar en `main`.
# Seguridad: solo corre para corridas de `ci-pr` disparadas por un push a `main` (código ya revisado y fusionado),
# nunca para PR: el token no se expone a código de un PR. Permisos mínimos; acciones fijadas a SHA.
# Configuración en GitHub (no se leen ni se crean aquí): secreto SONAR_TOKEN y variables SONAR_ORGANIZATION y SONAR_PROJECT_KEY.

on:
  workflow_run:
    workflows: [ci-pr]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: "Id de una corrida de ci-pr que tenga el artefacto api-reports"
        required: true
      sha:
        description: "Commit de esa corrida"
        required: true
      branch:
        description: "Rama de esa corrida"
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: sonarcloud-${{ github.event.workflow_run.head_branch || inputs.branch }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  SONAR_SCANNER_VERSION: "12.0.0"
  CI_RUN_ID: ${{ github.event.workflow_run.id || inputs.ci_run_id }}
  CI_SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
  CI_BRANCH: ${{ github.event.workflow_run.head_branch || inputs.branch }}

jobs:
  sonarcloud:
    name: SonarCloud (informativo, fuera del gate)
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion != 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Comprobar la configuración
        id: cfg
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_ORGANIZATION" ] || [ -z "$SONAR_PROJECT_KEY" ]; then
            echo "::warning::Falta SONAR_TOKEN, SONAR_ORGANIZATION o SONAR_PROJECT_KEY: se omite el análisis."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.cfg.outputs.ready == 'true'
        with:
          ref: ${{ env.CI_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: steps.cfg.outputs.ready == 'true'
        with:
          global-json-file: global.json
      - name: Cobertura de la corrida de ci-pr
        if: steps.cfg.outputs.ready == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: api-reports
          run-id: ${{ env.CI_RUN_ID }}
          github-token: ${{ github.token }}
          path: reports
      - name: Cobertura en formato de Sonar
        if: steps.cfg.outputs.ready == 'true'
        run: |
          dotnet tool restore
          test -f reports/coverage/Cobertura.xml || { echo "::error::La corrida $CI_RUN_ID no trae reports/coverage/Cobertura.xml"; exit 1; }
          dotnet tool run reportgenerator -reports:reports/coverage/Cobertura.xml -targetdir:reports/sonar -reporttypes:SonarQube -sourcedirs:"$GITHUB_WORKSPACE"
      - name: Instalar SonarScanner para .NET
        if: steps.cfg.outputs.ready == 'true'
        run: |
          dotnet tool install --global dotnet-sonarscanner --version "$SONAR_SCANNER_VERSION"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Análisis (begin, build, end)
        if: steps.cfg.outputs.ready == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          DOTNET_ROLL_FORWARD: Major
        run: |
          dotnet sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.scm.revision="$CI_SHA" \
            /d:sonar.coverageReportPaths="reports/sonar/SonarQube.xml" \
            /d:sonar.exclusions="legacy/**,docs/**,**/bin/**,**/obj/**" \
            /d:sonar.coverage.exclusions="tests/**"
          dotnet restore Knock.slnx --locked-mode
          dotnet build Knock.slnx -c Release --no-restore
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
