name: ci-deploy

# KNOCK-202: tras un CI verde de ci-pr en main, construye cada imagen desde el runner, la
# escanea con Trivy y la publica en acrknockdevtn01.azurecr.io etiquetada con el SHA completo
# del commit. Solo corre si el CI terminó en éxito y el commit pertenece a main.
# - workflow_run (no pull_request_target): el código que corre es el del commit fijado de main.
# - Autenticación Azure por OIDC con azure/login: sin secretos permanentes; Client/Tenant/
#   Subscription llegan por variables de repositorio (vars.AZURE_*). Permisos mínimos por job.
# - Sin `az acr build` ni ACR Tasks: el build sale del runner (docker/build-push-action).
# - Solo se construye el servicio que cambió en el commit (detect; Knock.Contracts afecta a todos).
# - Sin etiqueta `latest`: la única etiqueta es el SHA completo.
# - Después del push actualiza los Container Apps que cambiaron y corre la prueba de humo contra
#   los cuatro servicios (CA-03 de la spec 007; autorizado por el Tech Lead el 2026-11-10). Costo cero: solo
#   az CLI en el runner, sin recursos ni secretos nuevos. Todo se busca dentro de RESOURCE_GROUP.
# - Un despliegue a la vez (grupo de concurrencia fijo): dos fusiones seguidas se encolan, no corren en paralelo.
# - Acciones fijadas por SHA (scripts/ci/pin_actions.py).

on:
  workflow_run:
    workflows: [ci-pr]
    branches: [main]
    types: [completed]

permissions:
  contents: read

# Grupo fijo: solo un despliegue corre a la vez y los siguientes esperan (con el SHA en el grupo, dos fusiones
# seguidas corrían en paralelo). GitHub guarda una sola corrida pendiente: si llegan tres seguidas, la de en medio
# se cancela antes de empezar (ver «Riesgos» del PR #74).
concurrency:
  group: ci-deploy-main
  cancel-in-progress: false

env:
  ACR_NAME: acrknockdevtn01
  ACR_REGISTRY: acrknockdevtn01.azurecr.io
  # Grupo de recursos de los Container Apps (deploy/README.md: por defecto rg-knock-dev). Nunca se busca en toda la suscripción.
  RESOURCE_GROUP: rg-knock-dev

jobs:
  detect:
    name: Detectar servicios del commit
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      gateway: ${{ steps.d.outputs.gateway }}
      identity: ${{ steps.d.outputs.identity }}
      messaging: ${{ steps.d.outputs.messaging }}
      market: ${{ steps.d.outputs.market }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: d
        run: |
          # Detección equivalente a la de ci-pr (los outputs tienen el mismo significado).
          # - Commit de merge (flujo normal de PRs a main): HEAD~1 es el primer padre y el diff
          #   cubre enteros los cambios del PR, sin omitir commits anteriores del push.
          # - Push lineal a main: sin el `before` del push no se puede delimitar cuántos commits
          #   trajo; se reconstruye todo (dirección segura: nunca se omite un servicio cambiado).
          NP=$(git rev-list --parents -n 1 HEAD 2>/dev/null | wc -w)
          if [ "${NP:-0}" -ge 3 ]; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "__ALL__")
          else
            CHANGED="__ALL__"
          fi
          # Un cambio en los contratos compartidos (Knock.Contracts) o en archivos compartidos
          # de compilación (Directory.Build.*, Directory.Packages.props, global.json,
          # NuGet.config, *.sln/*.slnx, *.props/*.targets) afecta a los cuatro servicios.
          SHARED='^src/Knock\.Contracts/|^Directory\.|\.(slnx?|props|targets)$|^global\.json$|^[Nn]u[Gg]et\.config$'
          hit() { [ "$CHANGED" = "__ALL__" ] || grep -qE "$1" <<<"$CHANGED"; }
          {
            echo "gateway=$(hit "^src/Knock\.Gateway/|$SHARED" && echo true || echo false)"
            echo "identity=$(hit "^src/Knock\.Identity\.Api/|$SHARED" && echo true || echo false)"
            echo "messaging=$(hit "^src/Knock\.Messaging\.Api/|$SHARED" && echo true || echo false)"
            echo "market=$(hit "^src/Knock\.Market\.Api/|$SHARED" && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: Build, Trivy y push a ACR
    needs: detect
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    # Un job por servicio (spec 001, R-06: cada servicio se construye y se publica por separado).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { proyecto: Knock.Gateway, imagen: knock-gateway, salida: gateway }
          - { proyecto: Knock.Identity.Api, imagen: knock-identity, salida: identity }
          - { proyecto: Knock.Messaging.Api, imagen: knock-messaging, salida: messaging }
          - { proyecto: Knock.Market.Api, imagen: knock-market, salida: market }
    env:
      IMAGEN: acrknockdevtn01.azurecr.io/${{ matrix.imagen }}:${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Servicio sin cambios (no se construye ni se publica)
        if: needs.detect.outputs[matrix.salida] != 'true'
        run: 'echo "::notice::${{ matrix.imagen }} sin cambios en el commit: se omite su build."'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        if: needs.detect.outputs[matrix.salida] == 'true'
      # OIDC: la credencial federada vive en Azure; aquí solo variables, sin secretos permanentes.
      - name: Login en Azure (OIDC)
        if: needs.detect.outputs[matrix.salida] == 'true'
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Login en el registro (sesión OIDC de Azure)
        if: needs.detect.outputs[matrix.salida] == 'true'
        run: az acr login --name "${ACR_NAME}" --output none
      # load: true deja la imagen en el daemon para escanearla con Trivy y Dockle antes de publicarla.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        if: needs.detect.outputs[matrix.salida] == 'true'
        with:
          context: .
          file: src/${{ matrix.proyecto }}/Dockerfile
          load: true
          tags: ${{ env.IMAGEN }}
      # Trivy como contenedor oficial (igual que en ci-pr; KNOCK-232): bloquea en altas/críticas con corrección.
      - name: Trivy (críticas y altas con corrección bloquean)
        if: needs.detect.outputs[matrix.salida] == 'true'
        run: |
          docker run --rm             -v /var/run/docker.sock:/var/run/docker.sock             -v "$PWD:/work" -w /work             ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c             image --severity CRITICAL,HIGH --exit-code 1 --ignore-unfixed             --ignorefile .trivyignore --quiet "$IMAGEN"
      - name: Dockle (buenas prácticas de imagen)
        if: needs.detect.outputs[matrix.salida] == 'true'
        uses: goodwithtech/dockle-action@e30e6af832aad6ea7dca2a248d31a85eab6dbd68 # v0.4.15
        with:
          image: ${{ env.IMAGEN }}
          exit-code: "1"
          exit-level: warn
          # EXC-003 (security/exceptions.yaml): falsos positivos de CIS-DI-0010 en variables de la imagen base.
          # Solo estas claves; cualquier otra variable o archivo sospechoso sigue fallando.
          accept-key: DOTNET_VERSION,ASPNET_VERSION,ASPNETCORE_URLS,ASPNETCORE_ENVIRONMENT,ASPNETCORE_HTTP_PORTS,DOTNET_RUNNING_IN_CONTAINER,DOTNET_EnableDiagnostics,APP_UID,org.opencontainers.image.version,org.opencontainers.image.title,org.opencontainers.image.description,org.opencontainers.image.created,--gid,--uid,--clear,PATH
      - name: "Push a ACR (etiqueta: SHA completo del commit)"
        if: needs.detect.outputs[matrix.salida] == 'true'
        run: docker push "${IMAGEN}"

  deploy:
    name: Desplegar en Container Apps
    needs: [detect, publish]
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Login en Azure (OIDC)
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Actualizar la imagen de los servicios que cambiaron
        env:
          CAMBIOS: ${{ toJSON(needs.detect.outputs) }}
        run: |
          set -euo pipefail
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          for svc in gateway identity messaging market; do
            if [ "$(jq -r --arg s "$svc" '.[$s]' <<<"$CAMBIOS")" != "true" ]; then
              echo "knock-$svc sin cambios: no se actualiza."; continue
            fi
            if ! az containerapp show --name "knock-$svc" --resource-group "$RESOURCE_GROUP" --query name -o tsv >/dev/null; then
              echo "::error::No existe el Container App knock-$svc en $RESOURCE_GROUP"; exit 1
            fi
            az containerapp update --name "knock-$svc" --resource-group "$RESOURCE_GROUP" \
              --image "${ACR_REGISTRY}/knock-$svc:${SHA}" --output none
            echo "::notice::knock-$svc desplegado con la imagen ${SHA}"
          done

  smoke:
    name: Prueba de humo (revisiones y gateway)
    needs: [detect, deploy]
    if: success()
    runs-on: ubuntu-latest
    # Hasta 5 minutos por servicio (4) más 5 del gateway.
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Login en Azure (OIDC)
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Identity, Market y Messaging no tienen ingreso público: se revisan por su revisión en Azure. Pasa cuando la última
      # revisión es la lista (latestRevisionName == latestReadyRevisionName), su sonda de /health/ready la marca Healthy y,
      # si el servicio cambió en el commit, corre la imagen con este SHA. Con revision_mode Single, en ese momento la
      # revisión anterior ya no recibe tráfico: el gateway no puede responder desde la vieja.
      - name: Revisión nueva y sana en los cuatro servicios
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          CAMBIOS: ${{ toJSON(needs.detect.outputs) }}
        run: |
          set -euo pipefail
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          for svc in gateway identity messaging market; do
            cambio=$(jq -r --arg s "$svc" '.[$s]' <<<"$CAMBIOS")
            esperada="${ACR_REGISTRY}/knock-$svc:${SHA}"
            listo=false
            for i in $(seq 1 20); do
              IFS=$'\t' read -r latest ready image < <(az containerapp show --name "knock-$svc" --resource-group "$RESOURCE_GROUP" \
                --query "[properties.latestRevisionName, properties.latestReadyRevisionName, properties.template.containers[0].image]" -o tsv | paste -sd $'\t')
              salud=$(az containerapp revision show --name "knock-$svc" --resource-group "$RESOURCE_GROUP" --revision "$latest" \
                --query "properties.healthState" -o tsv 2>/dev/null || echo "desconocida")
              if [ "$latest" = "$ready" ] && [ "$salud" = "Healthy" ] && { [ "$cambio" != "true" ] || [ "$image" = "$esperada" ]; }; then
                echo "::notice::knock-$svc sano en la revisión $latest (${image##*:})"; listo=true; break
              fi
              echo "knock-$svc intento ${i}: revisión ${latest} (lista: ${ready}, salud: ${salud}, imagen: ${image##*:}); reintento en 15 s."
              sleep 15
            done
            if [ "$listo" != "true" ]; then echo "::error::knock-$svc no quedó sano con la revisión nueva en 5 minutos"; exit 1; fi
          done
      # Reintenta hasta 5 minutos: con réplicas mínimas en 0 la primera petición puede tardar (arranque en frío).
      - name: GET /health y /health/ready por el gateway
        run: |
          set -euo pipefail
          fqdn=$(az containerapp show --name knock-gateway --resource-group "$RESOURCE_GROUP" --query "properties.configuration.ingress.fqdn" -o tsv)
          if [ -z "$fqdn" ]; then echo "::error::El gateway no tiene ingreso público"; exit 1; fi
          for i in $(seq 1 20); do
            if curl -fsS --max-time 10 "https://${fqdn}/health" >/dev/null \
               && curl -fsS --max-time 10 "https://${fqdn}/health/ready" >/dev/null; then
              echo "::notice::Prueba de humo correcta en el intento ${i}"; exit 0
            fi
            echo "Intento ${i}: todavía no responde; reintento en 15 s."; sleep 15
          done
          echo "::error::La prueba de humo no respondió en 5 minutos"; exit 1
