      primer endpoint y de la spec 026 (KNOCK-62). Aún no existe la biblioteca técnica compartida y un servicio no referencia a otro, así que se copian estas clases de
      src/Knock.Market.Api/Hosting, src/Knock.Market.Api/Common/Security y src/Knock.Gateway/Hosting cambiando solo el espacio de nombres y quitando lo que Mensajería no usa. EXC-007 y
      EXC-008 no las amparan; ForwardedHeadersExtensions no se incluye (la cubre EXC-020, PR 61). Las copias se prueban por separado en tests/SecurityTest/Messaging y
