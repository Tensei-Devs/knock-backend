    alcance: las huellas 28273243e79a874c99d33e23fe3a8e7d38b04767:tests/UnitTest/Panel/PanelFakes.cs:knock-mongodb-connection-string:160, :280 y :348, e0b8aac104197397959eadc41fe4398d5254c744:tests/UnitTest/Panel/Spec033AuditoriaTests.cs:knock-mongodb-connection-string:27 be3f8c97688c131b8b210782800200772d2adb77:tests/UnitTest/Panel/Spec033TotpDominioTests.cs:generic-api-key:160 y d4e6580e5e320bb5f16d04102e7f673e6d41f265:Memoria.md:knock-mongodb-connection-string:991 (la cadena de ejemplo citada en la entrada de Memoria.md de esta misma excepción) en .gitleaksignore (commits de la rama feature/KNOCK-75-panel-2fa-permissions; solo esas líneas de esos archivos en esos commits)
    justificacion: >-
      Falso positivo. PanelFakes y Spec033AuditoriaTests lanzan una excepción con una cadena de conexión de MongoDB inventada (usuario, clave y host de ejemplo) para comprobar que el servicio del panel nunca deja salir el texto de un error de la base de datos (spec 033); no es una credencial de ningún servicio.
      La línea 160 de Spec033TotpDominioTests usa el secreto de ejemplo publicado en el estándar TOTP (RFC 6238) para comprobar el enlace otpauth; es un valor público de prueba.
      Los commits quedan en el historial y Gitleaks revisa todas las ramas, por lo que marca todos los PR del repositorio. No se reescribe el historial. Las reglas siguen activas para cualquier otro archivo.
      Evidencia: hallazgo de Gitleaks 8.30.1 sobre todas las ramas del 2026-11-19 (reglas knock-mongodb-connection-string y generic-api-key, esos archivos y esas líneas), que puso en rojo el check de secretos de los PR #179 a #194 y los de Alexis.
