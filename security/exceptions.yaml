    alcance: solo los bloques copiados de Market e Identity en cuatro archivos nuevos de Mensajería, entre «// jscpd:ignore-start -- EXC-030» y «// jscpd:ignore-end»: src/Knock.Messaging.Api/Hosting/ValidationExtensions.cs (la clase ValidationFilter), src/Knock.Messaging.Api/Hosting/InternalControllersExtensions.cs (AddInternalControllers y InternalControllerFeatureProvider), src/Knock.Messaging.Api/Modules/Conversaciones/Domain/DomainException.cs (DomainException y DomainErrors) y src/Knock.Messaging.Api/Modules/Conversaciones/DomainExceptionHandler.cs. No se toca Market ni Identity.
    justificacion: >-
      KNOCK-72 (spec 030, infraestructura de controllers de Mensajería, PR #206): Mensajería necesita el filtro de validación (422 sin valores), el catálogo de errores de dominio con su manejador y el descubrimiento de controllers internal que ya tienen Market e Identity.
      La constitución no permite compartir código entre servicios fuera de Knock.Contracts y Knock.Hosting, y esas piezas aún no están en la biblioteca (spec 055, etapa 3, KNOCK-281), por lo que se copian sin cambios y cada servicio las prueba por separado.
      Son 6 bloques de 14 a 42 líneas (125 líneas, 0.18 % del código) y 3 grupos nuevos en la línea base de codemap (57 contra 54 en sprint-05).
      Esta excepción se aparta de R-09 de la spec 055 (desde la etapa 1, una copia nueva de una pieza del catálogo no se acepta con una excepción nueva). Moverlas ahora exige cambiar Market (DomainException se usa en 15 archivos de código y 26 de pruebas). Decisión del Tech Lead del 2026-11-20: aceptar la copia temporal ligada a KNOCK-281.
