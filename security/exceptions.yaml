      uno de 13 líneas (src/Knock.Market.Api/Hosting/RequestBodyLimitMiddleware.cs [11:9 - 24:2] contra src/Knock.Messaging.Api/Hosting/ProblemResponses.cs [18:9 - 31:2]) y otro de 25 líneas
      (src/Knock.Market.Api/Hosting/AuthenticationExtensions.cs [16:9 - 41:103] contra src/Knock.Messaging.Api/Hosting/AuthenticationExtensions.cs [43:9 - 68:37]). Aprobada por el líder el 2026-11-11, temporal y ligada a KNOCK-251.
    responsable: José Guillermo Rangel Hernández
    creada: 2026-11-11
    vence: 2027-01-15
    plan: renovada el 2026-11-24 hasta 2027-01-15 (KNOCK-266). RedisExtensions, JwtSettings, SecurityHeadersMiddleware y RateLimitingExtensions ya salieron a Knock.Hosting; quedan `AuthenticationExtensions.cs` y `ProblemResponses.cs` de Mensajería. `ProblemResponses` se mueve con spec 055 T-17 y `AuthenticationExtensions` cuando el resto de su lógica de eventos del JWT se parametrice; al mover ambos se retira la excepción.
