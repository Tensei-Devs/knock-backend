# Registro de excepciones de seguridad y calidad (constitución §8). Lo valida scripts/ci/check_exceptions.py.
# Reglas: máximo 90 días, responsable con nombre, evidencia en la justificación, plan de remediación.
# En el código, la supresión cita el ID en la misma línea:  // nosemgrep: knock-random-inseguro -- EXC-001
#
# Campos: id · herramienta · regla · alcance (rutas) · justificacion · responsable · creada (AAAA-MM-DD) · vence · plan
#
# Ejemplo (no activo):
#  - id: EXC-001
#    herramienta: semgrep
#    regla: knock-random-inseguro
#    alcance: tests/perf/data_builder.cs
#    justificacion: generador de datos ficticios para k6; no protege nada (evidencia en PR #123)
#    responsable: Ángel Alexis Blas Castillo
#    creada: 2026-10-20
#    vence: 2026-12-04
#    plan: reemplazar por Bogus en TT-QA-02
excepciones:
  - id: EXC-001
    herramienta: semgrep
    regla: python.lang.security.audit.dangerous-subprocess-use-tainted-env-args.dangerous-subprocess-use-tainted-env-args
    alcance: scripts/hooks/knock_guard.py
    justificacion: >-
      Falso positivo. La llamada usa una lista de argumentos (sin shell, no hay interpolación de comandos) y los
      nombres que recibe `--similar` salen de expresiones regulares de identificadores (`[A-Za-z]\w+`) que no
      pueden empezar con «-»; además se limitan a 8. Evidencia: revisión de scripts/hooks/knock_guard.py (función
      check_new_file) en el PR de KNOCK-26 y primera ejecución de Semgrep en el CI de ese PR.
    responsable: José Julián Hernández Hernández
    creada: 2026-10-14
    vence: 2027-01-12
    plan: validar los nombres con `re.fullmatch` antes de llamar o importar `codemap` en lugar de lanzar un subproceso, y retirar la excepción antes de vencer.
  - id: EXC-002
    herramienta: checkov
    regla: CKV_DOCKER_2
    alcance: src/Knock.Gateway/Dockerfile, src/Knock.Identity.Api/Dockerfile, src/Knock.Messaging.Api/Dockerfile, src/Knock.Market.Api/Dockerfile
    justificacion: >-
      El Dockerfile no define HEALTHCHECK. La API se despliega en Azure Container Apps, que define sus sondas
      (liveness y readiness sobre /health y /health/ready) fuera de la imagen, por lo que la instrucción no se usaría;
      además la imagen base aspnet no incluye curl ni wget. Evidencia: TC-TT-API-01-15 (PR #17), donde /health y
      /health/ready responden 200 en el contenedor, y el primer análisis de Checkov en el CI de ese PR.
    responsable: José Julián Hernández Hernández
    creada: 2026-10-15
    vence: 2027-01-13
    plan: definir las sondas en el Bicep de Container Apps (TT-AZ-02) y retirar la excepción; si se despliega sin sondas externas, agregar una herramienta de sondeo a la imagen.
  - id: EXC-003
    herramienta: dockle
    regla: CIS-DI-0010
    alcance: imágenes de los cuatro servicios (src/*/Dockerfile); workflow ci-pr.yml, paso de Dockle (accept-key)
    justificacion: >-
      Falso positivo. Dockle marca como «credenciales» variables de la imagen base de Microsoft y del propio
      Dockerfile (DOTNET_VERSION, ASPNET_VERSION, ASPNETCORE_URLS, ASPNETCORE_ENVIRONMENT, ASPNETCORE_HTTP_PORTS, DOTNET_RUNNING_IN_CONTAINER, DOTNET_EnableDiagnostics, APP_UID, las etiquetas org.opencontainers.image.version, .title, .description y .created, los argumentos --gid y --uid del `groupadd` de la imagen base, y desde .NET 11 (base Ubuntu 26.04) el argumento --clear y la variable PATH que aparecen en los comandos `umoci config` con que se construyó la imagen base);
      sus valores son versiones, puertos, el nombre del entorno, indicadores booleanos, un identificador de usuario y la ruta de búsqueda de programas, no secretos. Solo se aceptan esas claves
      con nombre: la regla sigue activa para cualquier otra variable o archivo. Evidencia: salida de Dockle en el CI del PR #17.
    responsable: José Julián Hernández Hernández
    creada: 2026-10-15
    vence: 2027-01-13
    plan: revisar con cada cambio de la imagen base y retirar las claves aceptadas que ya no aparezcan.
  - id: EXC-004
    herramienta: gitleaks
    regla: jwt, generic-api-key
    alcance: huellas en .gitleaksignore (commit de1c61af882345e0a8b75cf1afbce7213e245b22 del PR #89; tests/IntegrationTest/Support/TestController.cs, tests/SecurityTest/Observability/TraceContextInjectionTests.cs, tests/IntegrationTest/Observability/OutgoingHttpTelemetryTests.cs, tests/SecurityTest/Observability/SpanPrivacyTests.cs)
    justificacion: >-
      Falso positivo. Los cuatro hallazgos son valores sintéticos de prueba (un token JWT ficticio, un token de baggage y un token secreto de ejemplo) que las pruebas de privacidad y de propagación de trazas
      usan para comprobar que no salen en spans ni en registros; no son credenciales de ningún servicio y no hay nada que rotar. El texto ya se corrigió en el commit 27e5d4f de la misma rama,
      pero Gitleaks revisa todos los commits del PR y el repositorio no permite squash, así que el commit original sigue en la historia. Las huellas llevan el SHA `de1c61a`: el PR #89 debe fusionarse con **merge commit** y no con «Rebase and merge», que reescribe los SHA y haría que el Gitleaks del push a `sprint-02` volviera a marcar los cuatro hallazgos. Solo se aceptan esas cuatro huellas exactas:
      la regla sigue activa para cualquier otro archivo, línea o commit. Evidencia: salida de Gitleaks en el CI del PR #89.
    responsable: José Julián Hernández Hernández
    creada: 2026-11-03
    vence: 2027-01-31
    plan: fusionar el PR #89 con merge commit, comprobar el CI del push a `sprint-02` justo después y retirar la excepción y el archivo .gitleaksignore cuando el commit ya no entre en ningún análisis, o antes de que venza.
  - id: EXC-005
    herramienta: gitleaks
    regla: knock-mongodb-connection-string
    alcance: scripts/ci/test_ai_review.py (solo ese archivo, en la regla; no es una lista blanca global)
    justificacion: >-
      Falso positivo. La línea 169 de la prueba de enmascarado de secretos del script de pre-revisión contiene una cadena de MongoDB inventada
      para comprobar que el script oculta ese formato; no es una credencial de ningún servicio. La regla nueva sigue activa para cualquier otro archivo.
      Evidencia: análisis de Gitleaks con la regla nueva sobre el árbol de `sprint-02` (un solo hallazgo, ese archivo).
    responsable: José Julián Hernández Hernández
    creada: 2026-11-03
    vence: 2027-01-31
    plan: sustituir la muestra por una construida en tiempo de ejecución (como se hizo en el PR #89) y retirar la excepción antes de vencer.
  - id: EXC-006
    herramienta: dotnet
    regla: SYSLIB0066
    alcance: tests/UnitTest/Knock.UnitTest.csproj
    justificacion: >-
      En .NET 11 la interfaz IStartupValidator está marcada como obsoleta y las pruebas de arranque de MongoDB (KnockMongoOptionsTests y
      KnockMongoDatabasesTests) la usan por reflexión sobre el host. Se portó el código desde .NET 10 sin cambios de lógica; el aviso es solo de API obsoleta.
    responsable: José Julián Hernández Hernández
    creada: 2026-11-03
    vence: 2026-12-02
    plan: portar esas pruebas a IAsyncStartupValidator y retirar el NoWarn antes de vencer.
  - id: EXC-011
    herramienta: checkov
    regla: CKV_AZURE_233, CKV_AZURE_237, CKV_AZURE_167, CKV_AZURE_166, CKV_AZURE_165, CKV_AZURE_164, CKV_AZURE_163, CKV_AZURE_139
    alcance: deploy/modules/shared/main.tf, recurso azurerm_container_registry.this
    justificacion: >-
      Los controles piden ACR Premium (zonas, geo-replicación, cuarentena, firma, red privada, retención). La suscripción es Azure for Students y el costo de Premium no cabe en el crédito (ADR-006). La compensación es el escaneo de cada imagen con Trivy y Dockle en el CI (spec 007) y que el registro no tiene usuario administrador (CKV_AZURE_137 pasa). Evidencia: salida de Checkov sobre deploy/.
    responsable: José Julián Hernández Hernández
    creada: 2026-11-04
    vence: 2027-01-31
    plan: reevaluar si el proyecto pasa a una suscripción de pago y retirar las supresiones que ya se puedan cumplir.
  - id: EXC-012
    herramienta: checkov
    regla: CKV_AZURE_109, CKV_AZURE_189, CKV_AZURE_110, CKV_AZURE_42, CKV2_AZURE_32
    alcance: deploy/modules/shared/main.tf, recurso azurerm_key_vault.this
    justificacion: >-
      Container Apps no es un servicio de confianza del firewall de Key Vault, así que cerrar la red pública rompería la lectura de secretos; los endpoints privados cuestan. Sin protección contra purga para poder destruir y recrear el entorno dentro de la ventana de evaluación (ADR-006, punto 6); sí tiene borrado suave de 7 días. Compensación: RBAC, un permiso por secreto y por servicio (spec 005, R-05). Evidencia: pruebas de módulo en deploy/modules/service/tests.
    responsable: José Julián Hernández Hernández
    creada: 2026-11-04
    vence: 2027-01-31
    plan: activar purge protection y restringir la red al terminar la evaluación (5-dic-2026) o si se agrega una red privada.
  - id: EXC-013
    herramienta: checkov
    regla: CKV_AZURE_206, CKV_AZURE_33, CKV2_AZURE_21, CKV_AZURE_59, CKV2_AZURE_33, CKV2_AZURE_1
    alcance: deploy/modules/shared/main.tf, recursos azurerm_storage_account.files y azurerm_storage_container.private
    justificacion: >-
      Replicación geográfica, endpoints privados, llaves administradas por el cliente y registro de lecturas tienen costo o requieren una red privada que el crédito de estudiante no cubre. La cuenta no usa colas, no permite acceso público a blobs, tiene llaves compartidas desactivadas, TLS 1.2, borrado suave y SAS con vencimiento. Evidencia: salida de Checkov sobre deploy/.
    responsable: José Julián Hernández Hernández
    creada: 2026-11-04
    vence: 2027-01-31
    plan: reevaluar con los respaldos de MongoDB (spec 003, R-08) y retirar lo que ya se pueda cumplir.
  - id: EXC-014
    herramienta: checkov
    regla: CKV2_AZURE_31
    alcance: deploy/modules/shared/main.tf, recurso azurerm_subnet.container_apps
    justificacion: >-
      La subred está delegada a Container Apps, que administra su propio tráfico; un grupo de seguridad de red escrito a mano puede bloquear el plano de control del entorno. El único ingreso externo es el del gateway (spec 001, R-02). Evidencia: documentación de Container Apps sobre subredes delegadas.
    responsable: José Julián Hernández Hernández
    creada: 2026-11-04
    vence: 2027-01-31
    plan: agregar un NSG con las reglas que exige Container Apps cuando la spec 006 defina la política de red.
  - id: EXC-007
    herramienta: jscpd
    regla: duplicación de código (clones)
    alcance: src/Knock.Identity.Api/Hosting/{LoggingExtensions,ObservabilityExtensions,TelemetryRedactor}.cs, src/Knock.Messaging.Api/Hosting/{LoggingExtensions,ObservabilityExtensions,TelemetryRedactor}.cs y src/Knock.Gateway/Hosting/{LoggingExtensions,ObservabilityExtensions,TelemetryRedactor}.cs (9 archivos, entre «// jscpd:ignore-start -- EXC-007» y su cierre)
    justificacion: >-
      Spec 011 (KNOCK-206): los tres servicios y el gateway deben registrar con el mismo formato y la misma redacción de datos personales
      que Market. Aún no existe una biblioteca técnica compartida y un servicio no referencia a otro, así que se copian las tres clases de
      src/Knock.Market.Api/Hosting cambiando solo el espacio de nombres, la categoría por defecto del log y la ruta de salud. Las copias se
      prueban por separado en tests/UnitTest/Hosting/Spec011ObservabilityTests.cs. Aprobada por el líder el 2026-11-04.
    responsable: Ángel Alexis Blas Castillo
    creada: 2026-11-04
    vence: 2027-02-02
    plan: unificar las tres clases en una biblioteca técnica compartida (junto con las copias de EXC-008), quitar los marcadores y retirar la excepción antes de vencer.
  - id: EXC-008
    herramienta: jscpd, codemap
    regla: código duplicado (jscpd:ignore y línea base de clones de docs/architecture/clones-baseline.json)
    alcance: src/Knock.Identity.Api/Hosting/MongoExtensions.cs, src/Knock.Identity.Api/Hosting/RedisExtensions.cs, src/Knock.Identity.Api/Hosting/HealthExtensions.cs, src/Knock.Messaging.Api/Hosting/MongoExtensions.cs, src/Knock.Messaging.Api/Hosting/HealthExtensions.cs, src/Knock.Gateway/Hosting/RedisExtensions.cs, src/Knock.Gateway/Hosting/HealthExtensions.cs
    justificacion: >-
      Spec 003 (KNOCK-198): cada servicio necesita su cliente de MongoDB y de Redis, y la constitución solo permite una biblioteca
      compartida de tipos y contratos sin lógica (Knock.Contracts). Por decisión del líder del 2026-11-04 se aceptan por ahora copias
      de src/Knock.Market.Api/Hosting/MongoExtensions.cs y RedisExtensions.cs, y un HealthExtensions igual en los tres servicios,
      cada una marcada con «jscpd:ignore-start -- EXC-008». Evidencia: PR de KNOCK-198.
    responsable: Ángel Alexis Blas Castillo
    creada: 2026-11-04
    vence: 2027-02-02
    plan: unificar después en una biblioteca técnica (con su spec y el cambio de la constitución que la permita), borrar las copias y retirar la excepción antes de vencer.
