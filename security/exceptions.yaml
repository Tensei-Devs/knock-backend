  - id: EXC-021
    herramienta: jscpd, codemap
    regla: código duplicado (jscpd:ignore y línea base de clones de docs/architecture/clones-baseline.json)
    alcance: src/Knock.Messaging.Api/Hosting/AuthenticationExtensions.cs (1 archivo con su nombre exacto; ProblemResponses.cs salió a Knock.Hosting en KNOCK-266; RedisExtensions y JwtSettings pasaron a Knock.Hosting y SecurityHeadersMiddleware a Knock.Hosting.Security en KNOCK-281, entre «// jscpd:ignore-start -- EXC-021» y su cierre; RateLimitingExtensions.cs salió con KNOCK-280); no se amplía más allá de 5 (la siguiente copia obliga a hacer la biblioteca compartida)
    justificacion: >-
